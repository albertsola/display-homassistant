substitutions:
  house_load_entity: sensor.octopus_energy_electricity_21m0382813_1800019110490_current_demand
  gas_usage_entity: sensor.octopus_energy_gas_e6e06376882221_1091943707_current_accumulative_consumption_m3
  outdoor_temp_entity: sensor.th_outdoors_temperature_2
  outdoor_humidity_entity: sensor.th_outdoors_humidity_2
  presence_entity: binary_sensor.drive_person
  weather_entity: weather.forecast_home
  # Gauge min/max are runtime-adjustable from Home Assistant (see `number:` below).

esphome:
  name: round-dashboard
  friendly_name: Round Dashboard
  includes:
    - round_dashboard.h
  on_boot:
    # priority -100 runs after all component restores, so this wins over any
    # stale restored value. Screen + Dark Mode always start ON (until HA changes
    # them at runtime); rescue a zero brightness so the screen is visible.
    priority: -100
    then:
      - lambda: |-
          id(dark_mode) = true;
          id(screen_on) = true;
          if (id(brightness_pct) <= 0.0f) id(brightness_pct) = 100.0f;
      - script.execute: apply_backlight
      - script.execute: apply_rotation

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: arduino

logger:

api:
  encryption:
    key: "7udvHY95Ab6vnmrgyQMos6s6JiQL21VUN/8egP0xS9Y="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # HA can't resolve mDNS (.local) on this network, so tell ESPHome tooling
  # to reach the device by IP directly. Keep this IP stable via a DHCP
  # reservation for MAC F0:F5:BD:E9:C4:10 (or a manual_ip block).
  use_address: 10.12.13.192
  ap:
    ssid: Round Dashboard Fallback Hotspot
    password: "zbM8eexLsZ2C"

captive_portal:

time:
  - platform: sntp
    id: ha_time
    timezone: Europe/London

spi:
  clk_pin: GPIO6
  mosi_pin: GPIO7

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true      # boot log reports a device at 0x15 only if the touch chip exists

# Tap the screen to toggle dark (night) mode. Requires the CST816 touch
# controller, which is only present on the "C" (touch) board variant.
touchscreen:
  platform: cst816
  id: touch
  interrupt_pin: GPIO0
  skip_probe: true
  # reset_pin is shared with the display on GPIO1 (owned by the display component).
  on_release:
    then:
      - lambda: 'id(dark_mode) = !id(dark_mode);'

globals:
  - id: dark_mode
    type: bool
    restore_value: true     # always ON (dark) after every reboot
    initial_value: 'true'    # dark theme by default
  - id: brightness_pct
    type: float
    restore_value: true
    initial_value: '100.0'
  - id: screen_on
    type: bool
    restore_value: true     # always ON after every reboot
    initial_value: 'true'
  - id: rotation_deg
    type: int
    restore_value: true
    initial_value: '180'     # default 180 degrees

# Drives the hardware backlight PWM: brightness level while the screen is on,
# fully off when the Screen switch is off. Called from the Brightness number,
# the Screen switch, and on boot.
script:
  - id: apply_backlight
    then:
      - output.set_level:
          id: backlight_pwm
          level: !lambda 'return id(screen_on) ? (id(brightness_pct) / 100.0f) : 0.0f;'

  - id: apply_rotation
    then:
      - lambda: |-
          switch ((int) id(rotation_deg)) {
            case 0:   id(disp).set_rotation(display::DISPLAY_ROTATION_0_DEGREES); break;
            case 90:  id(disp).set_rotation(display::DISPLAY_ROTATION_90_DEGREES); break;
            case 270: id(disp).set_rotation(display::DISPLAY_ROTATION_270_DEGREES); break;
            default:  id(disp).set_rotation(display::DISPLAY_ROTATION_180_DEGREES); break;
          }
      - lambda: 'id(disp).update();'

# Dark/Light theme (on = dark) + Screen power. Brightness is a separate Number
# and the theme never affects brightness.
switch:
  - platform: template
    name: "Dark Mode"
    id: dark_switch
    icon: "mdi:theme-light-dark"
    lambda: 'return id(dark_mode);'
    turn_on_action:
      - lambda: 'id(dark_mode) = true;'
    turn_off_action:
      - lambda: 'id(dark_mode) = false;'

  # Screen power (on/off), separate from the Brightness level.
  - platform: template
    name: "Screen"
    id: screen_power
    icon: "mdi:monitor"
    lambda: 'return id(screen_on);'
    turn_on_action:
      - lambda: 'id(screen_on) = true;'
      - script.execute: apply_backlight
    turn_off_action:
      - lambda: 'id(screen_on) = false;'
      - script.execute: apply_backlight

# Screen rotation, applied live via the display's set_rotation().
select:
  - platform: template
    name: "Screen Rotation"
    id: rotation_select
    icon: "mdi:screen-rotation"
    options: ["0", "90", "180", "270"]
    lambda: 'return std::to_string((int) id(rotation_deg));'
    set_action:
      - lambda: 'id(rotation_deg) = atoi(x.c_str());'
      - script.execute: apply_rotation

# HA-adjustable gauge ranges (min/max) for all four gauges. restore_value keeps
# changes across reboots; the display lambda reads these each frame.
number:
  # Backlight brightness level — multiple values (0-100%). Screen on/off is the
  # separate "Screen" switch above.
  - platform: template
    name: "Brightness"
    id: screen_brightness
    icon: "mdi:brightness-6"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    mode: slider
    lambda: 'return id(brightness_pct);'
    set_action:
      - lambda: 'id(brightness_pct) = x;'
      - script.execute: apply_backlight

  - platform: template
    name: "Electricity gauge min"
    id: elec_min
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 20000
    step: 100
    unit_of_measurement: W
    entity_category: config
    mode: box
  - platform: template
    name: "Electricity gauge max"
    id: elec_max
    optimistic: true
    restore_value: true
    initial_value: 10000
    min_value: 0
    max_value: 20000
    step: 100
    unit_of_measurement: W
    entity_category: config
    mode: box
  - platform: template
    name: "Gas gauge min"
    id: gas_min
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 50
    step: 0.5
    unit_of_measurement: "m³"
    entity_category: config
    mode: box
  - platform: template
    name: "Gas gauge max"
    id: gas_max
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 0
    max_value: 50
    step: 0.5
    unit_of_measurement: "m³"
    entity_category: config
    mode: box
  - platform: template
    name: "Temperature gauge min"
    id: temp_min
    optimistic: true
    restore_value: true
    initial_value: -10
    min_value: -40
    max_value: 60
    step: 1
    unit_of_measurement: "°C"
    entity_category: config
    mode: box
  - platform: template
    name: "Temperature gauge max"
    id: temp_max
    optimistic: true
    restore_value: true
    initial_value: 40
    min_value: -40
    max_value: 60
    step: 1
    unit_of_measurement: "°C"
    entity_category: config
    mode: box
  - platform: template
    name: "Humidity gauge min"
    id: hum_min
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    entity_category: config
    mode: box
  - platform: template
    name: "Humidity gauge max"
    id: hum_max
    optimistic: true
    restore_value: true
    initial_value: 100
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    entity_category: config
    mode: box

output:
  - platform: ledc
    pin: GPIO3
    id: backlight_pwm

font:
  - file:
      type: gfonts
      family: Share Tech Mono
    id: font_time
    size: 26
  - file:
      type: gfonts
      family: Orbitron
      weight: 500
    id: font_val
    size: 12
  - file:
      type: gfonts
      family: Space Grotesk
      weight: 500
    id: font_label
    size: 10
  # Material Design Icons (matches HA weather icons). Only the 15 weather
  # condition glyphs are pulled in.
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_weather
    size: 29
    glyphs:
      - "\U000F0599"  # sunny
      - "\U000F0594"  # clear-night (night)
      - "\U000F0595"  # partlycloudy
      - "\U000F0590"  # cloudy
      - "\U000F0591"  # fog
      - "\U000F0592"  # hail
      - "\U000F0593"  # lightning
      - "\U000F067E"  # lightning-rainy
      - "\U000F0596"  # pouring
      - "\U000F0597"  # rainy
      - "\U000F0598"  # snowy
      - "\U000F067F"  # snowy-rainy
      - "\U000F059D"  # windy
      - "\U000F059E"  # windy-variant
      - "\U000F0F2F"  # exceptional

sensor:
  - platform: homeassistant
    id: house_load
    entity_id: ${house_load_entity}
    internal: true

  - platform: homeassistant
    id: gas_usage
    entity_id: ${gas_usage_entity}
    internal: true

  - platform: homeassistant
    id: outdoor_temp
    entity_id: ${outdoor_temp_entity}
    internal: true

  - platform: homeassistant
    id: outdoor_humidity
    entity_id: ${outdoor_humidity_entity}
    internal: true

binary_sensor:
  # Presence sensor: when detected, the outer seconds ring turns solid red.
  - platform: homeassistant
    id: presence_sensor
    entity_id: ${presence_entity}
    internal: true

  # BOOT button (GPIO9) published to Home Assistant so automations can react to
  # it. GPIO9 is a strapping pin: a press while running is fine, but do NOT hold
  # it at power-on (that enters flash mode).
  - platform: gpio
    name: "Boot Button"
    id: boot_button
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true

text_sensor:
  # Weather entity state = current condition string (sunny, rainy, ...).
  - platform: homeassistant
    id: weather_condition
    entity_id: ${weather_entity}
    internal: true

display:
  - platform: mipi_spi
    id: disp
    model: GC9A01A
    invert_colors: true
    reset_pin: GPIO1
    cs_pin: GPIO10
    dc_pin: GPIO2
    dimensions: 240x240
    # Rotation is set at runtime from the "Screen Rotation" select (default 180)
    # via set_rotation() in the apply_rotation script.
    update_interval: 1s
    lambda: |-
      auto p = rd::make_palette(id(dark_mode));
      it.fill(p.background);

      auto now = id(ha_time).now();
      int sec = now.is_valid() ? now.second : -1;
      bool presence = id(presence_sensor).state;

      // Outer bezel (or a solid red ring when presence is detected).
      // The current-second tick is drawn LAST so it sits on top of everything.
      if (presence) rd::draw_presence_ring(it);
      else          rd::draw_bezel(it, p);

      // Main concentric gauges: Electricity (outer) + Gas (inner), HA-scaled.
      float elec = id(house_load).state;
      float gas = id(gas_usage).state;
      rd::draw_ring_gauge(it, 96, 110, rd::scale_value(elec, id(elec_min).state, id(elec_max).state), p.elec, p.elec_track);
      rd::draw_ring_gauge(it, 78, 92,  rd::scale_value(gas,  id(gas_min).state,  id(gas_max).state),  p.gas,  p.gas_track);

      // Electricity & Gas value strings (Gas inner/above, Electricity outer/below).
      char elec_s[24], gas_s[24];
      if (isnan(elec)) snprintf(elec_s, sizeof(elec_s), "-- W"); else snprintf(elec_s, sizeof(elec_s), "%.0f W", elec);
      if (isnan(gas)) snprintf(gas_s, sizeof(gas_s), "-- m3"); else snprintf(gas_s, sizeof(gas_s), "%.1f m3", gas);

      // Connector arc from each ring toward its label, stopping 3px short of the
      // label text on each side (gap sized to the measured label width).
      int lx, ly, ew, eh, gw, gh;
      it.get_text_bounds(0, 0, elec_s, id(font_val), TextAlign::TOP_LEFT, &lx, &ly, &ew, &eh);
      it.get_text_bounds(0, 0, gas_s, id(font_val), TextAlign::TOP_LEFT, &lx, &ly, &gw, &gh);
      rd::draw_connector(it, 103.0f, p.elec, ew / 2.0f + 3.0f);
      rd::draw_connector(it, 85.0f, p.gas, gw / 2.0f + 3.0f);

      // Values centered on each ring's mid-radius so text edges line up with the ring band.
      it.printf(120, 202, id(font_val), p.gas_value, TextAlign::CENTER, "%s", gas_s);
      it.printf(120, 220, id(font_val), p.elec_value, TextAlign::CENTER, "%s", elec_s);

      // Weather condition icon (top center) from HA weather.forecast_home.
      const char* wi = rd::weather_glyph(id(weather_condition).state);
      if (wi != nullptr) it.printf(120, 57, id(font_weather), p.text, TextAlign::CENTER, "%s", wi);

      // Center: Date over Time.
      static const char *const wd[] = {"Sun","Mon","Tue","Wed","Thu","Fri","Sat"};
      static const char *const mo[] = {"Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"};
      if (now.is_valid()) {
        it.printf(120, 84, id(font_val), p.text_dim, TextAlign::CENTER,
                  "%s, %d %s", wd[now.day_of_week - 1], now.day_of_month, mo[now.month - 1]);
        it.strftime(120, 108, id(font_time), p.text, TextAlign::CENTER, "%H:%M:%S", now);
      } else {
        it.printf(120, 108, id(font_time), p.text_off, TextAlign::CENTER, "--:--:--");
      }

      // Temperature (left) + Humidity (right) sub-dials below the time.
      float temp = id(outdoor_temp).state;
      it.filled_circle(90, 152, 25, p.dial_well);
      rd::draw_sub_gauge(it, 90, 152, rd::scale_value(temp, id(temp_min).state, id(temp_max).state), p.temp, p.sub_track);
      if (isnan(temp)) it.printf(90, 150, id(font_val), p.text, TextAlign::CENTER, "--");
      else             it.printf(90, 150, id(font_val), p.text, TextAlign::CENTER, "%.1f", temp);
      it.printf(90, 166, id(font_label), p.temp, TextAlign::CENTER, "TEMP");

      float hum = id(outdoor_humidity).state;
      it.filled_circle(150, 152, 25, p.dial_well);
      rd::draw_sub_gauge(it, 150, 152, rd::scale_value(hum, id(hum_min).state, id(hum_max).state), p.humidity, p.sub_track);
      if (isnan(hum)) it.printf(150, 150, id(font_val), p.text, TextAlign::CENTER, "--");
      else            it.printf(150, 150, id(font_val), p.text, TextAlign::CENTER, "%.0f%%", hum);
      it.printf(150, 166, id(font_label), p.humidity, TextAlign::CENTER, "HUM");

      // Seconds tick LAST, so it draws over everything else (labels, connectors).
      if (!presence && sec >= 0) rd::draw_seconds_tick(it, sec, p.seconds);
