# =============================================================================
# Dashboard Solar — THIS device (build entry point: `make build` / `make run`).
# -----------------------------------------------------------------------------
# Only device identity + network + secrets live here; everything else (display,
# fonts, logic, and the DEFAULT entity substitutions) comes from the reusable
# package below. To point the display at different entities, add a
# `substitutions:` block here — parent substitutions override the package's.
# For sharing the design with others, see example-device.yaml (github:// import).
# =============================================================================

# Override any package default here, e.g.:
# substitutions:
#   pv_entity: sensor.my_solar_total
#   load_entity: sensor.my_house_load

packages:
  dashboard_solar: !include dashboard-solar-package.yaml

esphome:
  name: round-dashboard
  friendly_name: Dashboard Solar

api:
  encryption:
    # Per-device key — REGENERATE before flashing a real device (esphome-style base64).
    key: "9Ztq2Lp5Rk8vNmrgyQMos6s6JiQL21VUN/8egP0xS9Y="

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # New device: set a stable IP (DHCP reservation) and add `use_address:` here once known.
  ap:
    ssid: Dashboard Solar Fallback Hotspot
    password: "zbM8eexLsZ2C"

captive_portal:
